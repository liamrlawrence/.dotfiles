# Unbinds
unbind Up
unbind Down
unbind Left
unbind Right
unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# Core
set -g prefix C-Space
bind C-Space send-prefix
set -g mouse on
set -g repeat-time 300
set -g set-titles on
set -g set-titles-string "#{user}@#{host_short}: #{s|$HOME|~|:pane_current_path}"
set -s default-terminal "tmux-256color"
set -s set-clipboard on
set -s extended-keys always

# Create windows & panes
bind c   run-shell "~/.config/tmux/scripts/spawn_with_venv.sh new-window"
bind %   run-shell "~/.config/tmux/scripts/spawn_with_venv.sh split-window -h"
bind '"' run-shell "~/.config/tmux/scripts/spawn_with_venv.sh split-window -v"

# Switch windows
bind -r C-n next-window
bind -r C-p previous-window
bind b last-window              # NOTE: default <prefix>+l behavior

# Move windows
bind -r C-S-Left swap-window -t -1\; select-window -t -1
bind -r C-S-Right swap-window -t +1\; select-window -t +1

# Renumber windows
bind r move-window -r

# Move panes
bind -r \[ swap-pane -U
bind -r \] swap-pane -D

# Vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Vim-like pane resizing
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5
# Alt for larger moves
bind -r M-k resize-pane -U 25
bind -r M-j resize-pane -D 25
bind -r M-h resize-pane -L 25
bind -r M-l resize-pane -R 25

# Makefile
bind -n C-M-b run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top    'clear; make build'"
bind -n C-M-d run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top    'clear; make debug'"
bind -n C-M-w run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top    'clear; make watch'"
bind -n C-M-r run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top -k 'clear; make run'"
bind -n C-M-p run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top    'clear; make release'"    # production
bind -n C-M-h run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top    'clear; make docs'"       # help
bind -n C-M-t run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top    'clear; make test'"
bind -n C-M-c run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top    'clear; make clean'"
bind -n C-M-k run-shell "~/.config/tmux/scripts/sendkey_pane.sh --x right --y top -k"                          # kill

# Notes
bind o run-shell "~/.config/tmux/scripts/toggle_orgmode_pane.sh"
bind O run-shell "~/.config/tmux/scripts/toggle_orgmode_pane.sh --fullscreen"

# Theme
run-shell "~/.config/tmux/scripts/set_theme.sh"
bind T command-prompt -p "Enter theme name: " { run-shell "~/.config/tmux/scripts/set_theme.sh %1" }
bind M-t run-shell "~/Dev/almanac/bin/sunrise.sh"

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"

set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @resurrect-dir "~/.config/tmux/resurrect"
set -g @resurrect-strategy-vim "session"
set -g @resurrect-strategy-nvim "session"
set-hook -g client-detached { run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh" }

set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-save-interval "10"
set -g @continuum-restore "on"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.config/tmux/plugins/tpm/tpm"

